# XcodeGen project spec — regenerate the project with `xcodegen generate`.
# The .xcodeproj is gitignored; this file is the source of truth.
name: HadronIOS
options:
  bundleIdPrefix: com.hadronmemory
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  HadronKit:
    path: HadronKit

targets:
  Hadron:
    type: application
    platform: iOS
    sources:
      - Hadron
    dependencies:
      - package: HadronKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hadronmemory.ios
        PRODUCT_NAME: Hadron
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Match hadron-macapp: UI-driven, single-actor by design — Swift 5
        # language mode keeps concurrency checking pragmatic. Migrate both
        # apps to Swift 6 mode together, with HadronKit.
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V2NXQ22BM9
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        ENABLE_USER_SCRIPT_SANDBOXING: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Hadron/Info.plist
      properties:
        CFBundleDisplayName: Hadron
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # HTTPS-only via ATS defaults — standard exempt encryption.
        ITSAppUsesNonExemptEncryption: false
